<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>记录 - Rhine</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
      max-width: 720px;
    }
    .category-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: var(--shadow);
      transition: all 0.35s ease;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .category-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: rgba(37, 99, 235, 0.25);
    }
    .category-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      margin-bottom: 1.25rem;
    }
    .category-icon.notes-icon {
      background: linear-gradient(135deg, rgba(37,99,235,0.1), rgba(124,58,237,0.1));
      color: var(--accent);
    }
    .category-icon.screenshot-icon {
      background: linear-gradient(135deg, rgba(16,185,129,0.1), rgba(6,182,212,0.1));
      color: #10b981;
    }
    .category-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .category-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 1rem;
    }
    .category-count {
      font-size: 0.78rem;
      color: var(--accent);
      font-weight: 600;
    }
    .category-arrow {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.82rem;
      color: var(--accent);
      font-weight: 600;
      margin-top: 0.75rem;
      transition: gap 0.2s;
    }
    .category-card:hover .category-arrow {
      gap: 0.6rem;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">Rhine<span>.</span></a>
      <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="projects.html">项目</a>
        <a href="blog.html">博客</a>
        <a href="poetry.html">诗集</a>
        <a href="records.html" class="active">记录</a>
        <a href="about.html">关于我</a>
      </div>
      <div class="clock" id="clock">--:--:--</div>
    </div>
  </nav>

  <div class="container">
    <h1 class="page-title">记录</h1>
    <p class="page-desc">学习过程中的点滴记录</p>

    <div class="category-grid">
      <!-- 手写笔记 -->
      <a href="records/notes.html" class="category-card">
        <div class="category-icon notes-icon">&#9997;</div>
        <div class="category-title">RAG 学习手写笔记</div>
        <div class="category-desc">从零学习 RAG 技术过程中的手写笔记，涵盖 Embedding、混合检索、Reranker、FastAPI、Docker、MCP 等核心知识点</div>
        <div class="category-count">13 篇笔记</div>
        <div class="category-arrow">查看全部 &rarr;</div>
      </a>

      <!-- 运行截图（预留） -->
      <a href="records/screenshots.html" class="category-card">
        <div class="category-icon screenshot-icon">&#128187;</div>
        <div class="category-title">运行截图</div>
        <div class="category-desc">代码调试、系统运行、Docker 部署等过程的截图记录</div>
        <div class="category-count" style="color:#10b981;">即将添加</div>
        <div class="category-arrow" style="color:#10b981;">敬请期待 &rarr;</div>
      </a>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Rhine &middot; Logic Junction X</p>
  </footer>

  <script>
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const dateStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
      document.getElementById('clock').textContent = dateStr + ' ' + hours + ':' + minutes + ':' + seconds;
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
